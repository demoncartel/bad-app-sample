openapi: 3.0.3
info:
  title: Legacy Orders API
  version: "1.0.0"
  description: |
    Deliberately insecure and outdated: test fixture for health scanning. Never deploy.

    A small ASP.NET Core "legacy orders" Web API. GET responses are serialised
    with Newtonsoft.Json default settings (PascalCase property names). POST
    request bodies are model-bound by ASP.NET Core (property names are
    case-insensitive).
  contact:
    name: demoncartel
    url: https://github.com/demoncartel/bad-app-sample
paths:
  /api/orders:
    get:
      operationId: getAllOrders
      summary: List orders
      tags:
        - Orders
      responses:
        "200":
          description: A list of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      summary: Create an order
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /api/orders/{id}:
    get:
      operationId: getOrderById
      summary: Get an order by id
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          description: Order identifier.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order exists with the given id.
components:
  schemas:
    Order:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        CustomerName:
          type: string
          nullable: true
        Total:
          type: number
          format: double
        CreatedAt:
          type: string
          format: date-time
